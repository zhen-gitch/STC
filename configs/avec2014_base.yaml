# Shared base config for the MTL-Lite mainline.
# Legacy end-to-end settings are kept in configs/pre/default_config.yaml.

MODE: "mtl_lite"

SEED: 42

ACCELERATOR: "gpu"
DEVICES: [1]
STRATEGY: "auto"
PRECISION: "bf16-mixed"
RUN_TEST_AFTER_FIT: True

EARLY_STOPPING:
  ENABLE: False
  MONITOR: "val_RMSE_epoch"
  MODE: "min"
  PATIENCE: 8
  MIN_DELTA: 0.0
  STRICT: True
  CHECK_FINITE: True

EXPERIMENT_GROUP: "default"
EXPERIMENT_NAME: "mtl_lite"

BACKBONE_OUT_DIMS:
  iresnet50: 512
  resnet50: 2048
  vit_base_patch16_224: 768
  vit_small_patch16_224: 384
  vit_tiny_patch16_224: 192
  deit_tiny_patch16_224: 192
  deit_small_patch16_224: 384

EXTRACT_FEATURE:
  MAX_SCORE: 63
  NUM_WORKERS: 16
  BATCH_SIZE: 16
  MODEL_NAME: "deit_tiny_patch16_224"
  TIMM_PRETRAINED: False
  MODEL_WEIGHT_PATH: null
  CHUNK_SIZE: 200
  FREEZE_BACKBONE: False
  FINETUNE_LAST_N_BLOCKS: 0

PROCESS_TEMPORAL:
  HIDDEN_DIM: 192
  CLASS_STEP: 2
  SAMPLE_STEP: 10
  MAX_SEQ_LEN: 3000
  SAMPLING_STRATEGY: "stride_head"
  DROPOUT: 0.35
  LEARNING_RATE: 1e-4
  WEIGHT_DECAY: 5e-4
  MAX_EPOCHS: 80

DATASET:
  RETURN_MULTI_VIEW_TRAIN: False
  INPUT_VARIANT: "rgb"
  PHOTOMETRIC_NORMALIZATION:
    MODE: "none"
    TARGET_MEDIAN: 0.50
    TARGET_SPAN: 0.50
    LOW_QUANTILE: 0.10
    HIGH_QUANTILE: 0.90
    MAX_LUMA_SHIFT: 0.20
    MIN_CONTRAST_SCALE: 0.75
    MAX_CONTRAST_SCALE: 1.33
    BLACK_THRESHOLD: 8
    STATS_MAX_FRAMES: 32
    STATS_SPATIAL_STRIDE: 4
    MIN_VALID_STAT_PIXELS: 256
    MIN_VALID_STAT_FRACTION: 0.05

MODEL:
  AUXILIARY_TASKS:
    ORDINAL_CLASSIFICATION: True

LOSSES:
  ORDINAL_WEIGHT: 1.0
  CCC_WEIGHT: 0.0
  # Explicit parameter penalties are disabled in the historical baseline.
  L1_WEIGHT: 0.0
  L2_WEIGHT: 0.0
