# Shared P0/P1/P2 photometric protocol.
#
# This is the Stage C C-REF/E2 validation-only policy copied into a standalone
# experiment group.  P0/P1/P2 layer on top and differ only in experiment name
# and PHOTOMETRIC_NORMALIZATION.MODE.  MODEL_WEIGHT_PATH remains machine-local
# and must be provided by configs/local_paths.yaml.

EXPERIMENT_GROUP: "photometric_normalization"
SEED: 42
RUN_TEST_AFTER_FIT: False

EARLY_STOPPING:
  ENABLE: True
  MONITOR: "val_RMSE_epoch"
  MODE: "min"
  PATIENCE: 8
  MIN_DELTA: 0.0
  STRICT: True
  CHECK_FINITE: True

EXTRACT_FEATURE:
  FREEZE_BACKBONE: True
  FINETUNE_LAST_N_BLOCKS: 2

PROCESS_TEMPORAL:
  MAX_SEQ_LEN: 2000
  CLASS_STEP: 10
  MAX_EPOCHS: 40

DATASET:
  INPUT_VARIANT: "rgb"

MODEL:
  AUXILIARY_TASKS:
    ORDINAL_CLASSIFICATION: False
  IDENTITY_ADVERSARIAL:
    ENABLE: False
  SEVERITY_BALANCED_REGRESSION:
    ENABLE: True
    POWER: 0.5
    MIN_WEIGHT: 0.5
    MAX_WEIGHT: 4.0
    EDGES: [13, 19, 28]
  TASK_NUISANCE:
    ENABLE: False
    VARIANT: "split"
    DEP_DIM: 96
    NUISANCE_DIM: 96
    RECONSTRUCTION_ENABLE: False
    CROSS_CORRELATION_ENABLE: False
    AUXILIARY_CALIBRATION_ONLY: False
    CALIBRATION_STEPS: 100

LOSSES:
  ORDINAL_WEIGHT: 0.1
  CCC_WEIGHT: 0.0
  RECONSTRUCTION_WEIGHT: 0.0
  CROSS_CORRELATION_WEIGHT: 0.0
