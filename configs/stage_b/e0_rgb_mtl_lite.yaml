# Stage B E0: regression_only baseline (both Stage B switches OFF).
#
# Layer on top of configs/stage_b/base_regression_only.yaml, which reproduces
# the Stage A regression_only baseline (frozen deit_tiny + last-2-block
# finetune, ordinal off, pure regression).  E0 is the comparison anchor for
# E1/E2/E3 -- the four experiments share that base and differ ONLY in the
# switches below.
#
# Run:
#   python scripts/train_mtl_lite.py \
#     --override configs/stage_b/base_regression_only.yaml \
#     --override configs/stage_b/e0_rgb_mtl_lite.yaml

EXPERIMENT_NAME: "e0_rgb_mtl_lite"

MODEL:
  IDENTITY_ADVERSARIAL:
    ENABLE: False
  SEVERITY_BALANCED_REGRESSION:
    ENABLE: False
