# Copy this file to configs/local_paths.yaml on each machine.
# Do not commit configs/local_paths.yaml.

IMAGE_DIR: "/path/to/AVEC2014/face_images"
LABEL_DIR: "/path/to/AVEC2014/depression_labels"
DATASET_SPLIT_FILE: "/path/to/AVEC2014/dataset_split.json"

# OpenFace per-video landmark/quality CSV root (AVEC2014 OpenFace-aligned).
# Read by audit_alignment_geometry.py (landmarks) and audit_openface_quality.py
# (confidence/success/pose/gaze) for the A3 artifact weak-label chain.  Set to
# null (or leave unset) to gracefully skip those two A3 sub-steps; black_artifacts
# and temporal_sampling only need IMAGE_DIR and still run.
DATASET:
  OPENFACE_ROOT: null

# Primary output root for all experiments.
# Runs are written as <LOG_DIR>/<EXPERIMENT_GROUP>/<EXPERIMENT_NAME>/version_N/.
LOG_DIR: "/path/to/experiment/logs"

# Backbone pretrained weights.  Required when EXTRACT_FEATURE.FREEZE_BACKBONE
# is True (Stage B base_regression_only.yaml freezes the backbone + finetunes
# the last 2 blocks).  Set to null to train from scratch.  Example (server):
#   "/usr/local/conda/zhen/stc/weights/deit_tiny_patch16_224/model.pth"
# This is merged on top of the base config, so it overrides
# EXTRACT_FEATURE.MODEL_WEIGHT_PATH without touching other EXTRACT_FEATURE keys.
EXTRACT_FEATURE:
  MODEL_WEIGHT_PATH: null
