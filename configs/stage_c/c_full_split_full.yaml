MODEL:
  TASK_NUISANCE:
    ENABLE: True
    VARIANT: "split"
    DEP_DIM: 96
    NUISANCE_DIM: 96
    RECONSTRUCTION_ENABLE: True
    CROSS_CORRELATION_ENABLE: True

LOSSES:
  RECONSTRUCTION_WEIGHT: 0.001
  CROSS_CORRELATION_WEIGHT: 0.01
