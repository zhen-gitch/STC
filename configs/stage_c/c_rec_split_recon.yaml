# C-REC: split representation with the frozen reconstruction weight.
EXPERIMENT_NAME: "c_rec_split_recon"

MODEL:
  TASK_NUISANCE:
    ENABLE: True
    VARIANT: "split"
    DEP_DIM: 96
    NUISANCE_DIM: 96
    RECONSTRUCTION_ENABLE: True
    CROSS_CORRELATION_ENABLE: False

LOSSES:
  RECONSTRUCTION_WEIGHT: 0.001
  CROSS_CORRELATION_WEIGHT: 0.0
